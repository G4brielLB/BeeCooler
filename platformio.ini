; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = sensor


; ---------------------------------------------------------------- Fase 1
; Firmware de producao. Fontes em src/sensor (no sensor, ESP32-S3) e
; src/gateway (central, ESP32-WROOM). Os envs da Fase 0 ficam mais abaixo.

[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:sensor]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/sensor_16mb.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<sensor/>

; Modo de teste acelerado (D53): ciclo de 30 s, LoRa a cada 3 min.
[env:sensor_fast]
extends = env:sensor
build_flags =
    ${env:sensor.build_flags}
    -DBEE_TEST_FAST=1

[env:gateway]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions/gateway_4mb.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_src_filter =
    -<*>
    +<gateway/>

; Gateway com injecao de falhas para CT-03 / CT-12.
[env:gateway_fault]
extends = env:gateway
build_flags =
    -DBEE_GATEWAY_FAULT_INJECTION=1

; ---------------------------------------------------------------- Producao
; Versao de producao dos dois firmwares (src/sensor_prod e src/gateway_prod),
; com as correcoes do relatorio da AP2 (secao 8.2, passo 2, e Tabela 12).
; No cold boot cada placa le o DX-LR32 por AT, acha a UART e provisiona
; UART 115200 / LEVEL 3. Desligar o provisionamento: -DBEE_LORA_AUTOPROVISION=0.
; Trocar o perfil de radio (nos dois): -DBEE_LORA_LEVEL=2. Radio do no em sleep
; (SWITCH=1, exige resistores em serie em M0/M1): -DBEE_LORA_SWITCH1=1.
; Com o circuito da bateria montado: -DBEE_VBAT_CIRCUIT=1 (e -DBEE_POWER_POLICY=1).

[env:sensor_prod]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = partitions/sensor_16mb.csv
board_build.arduino.memory_type = qio_opi
; Arquivo unico (src/sensor_prod/main.cpp), no formato do comunicacao_s3_test:
; usa os drivers de src/sensor listados abaixo (o DS1302 e proprio do main.cpp).
; Serial pela UART0 (conversor USB-serial), como na bancada que rodou o CT-01:
; a UART nao bloqueia sem PC e sobrevive ao deep sleep, ao contrario da USB-CDC.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    -<*>
    +<sensor_prod/>
    +<sensor/Sht30Pair.cpp>
    +<sensor/Adxl345Fifo.cpp>
    +<sensor/SharedSpi.cpp>
    +<sensor/BatteryMonitor.cpp>
    +<sensor/FlashRing.cpp>
    +<sensor/RawSink.cpp>

; Modo acelerado (D53): ciclo de 30 s e sessao LoRa a cada 3 min, para validar
; com cortes de energia antes de qualquer ensaio longo (relatorio 8.2).
[env:sensor_prod_fast]
extends = env:sensor_prod
build_flags =
    ${env:sensor_prod.build_flags}
    -DBEE_TEST_FAST=1

[env:gateway_prod]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions/gateway_4mb.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_src_filter =
    -<*>
    +<gateway_prod/>

[env:gateway_prod_fault]
extends = env:gateway_prod
build_flags =
    -DBEE_GATEWAY_FAULT_INJECTION=1

; Teste de comunicacao simplificado: S3 le os sensores e envia por LoRa a cada
; 60 s; a central so imprime o que recebe na serial (sem Wi-Fi/AWS).
[env:comunicacao_s3_test]
extends = esp32_base
lib_ignore = BeeCoolerActuator
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBEE_ADXL_NO_INT1=1
build_src_filter =
    -<*>
    +<comunicacao_s3_test/>
    +<sensor/Sht30Pair.cpp>
    +<sensor/Adxl345Fifo.cpp>
    +<sensor/SharedSpi.cpp>
    +<sensor/BatteryMonitor.cpp>
    +<sensor/Ds1302Clock.cpp>

[env:comunicacao_wroom_test]
extends = esp32_base
board = esp32dev
build_src_filter =
    -<*>
    +<comunicacao_wroom_test/>

; Testes unitarios no host: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17


; ---------------------------------------------------------------- Fase 0
; Firmwares de teste antigos (nao fazem parte da Fase 1).

[env:phase0_base]
extends = esp32_base
board = esp32dev
lib_deps =
    adafruit/Adafruit ADXL345
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SHT31 Library

[env:sensor_bench]
extends = env:phase0_base
build_src_filter =
    -<*>
    +<sensor_bench/>

[env:sensor_espnow_test]
extends = env:phase0_base
extra_scripts = pre:scripts/load_env.py
build_src_filter =
    -<*>
    +<sensor_espnow_test/>

[env:gateway_espnow_test]
extends = env:phase0_base
extra_scripts = pre:scripts/load_env.py
build_src_filter =
    -<*>
    +<gateway_espnow_test/>

[env:s3_usb_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/cu.usbmodem5CF70235711
monitor_port = /dev/cu.usbmodem5CF70235711
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0

build_src_filter =
    -<*>
    +<s3_usb_test/>