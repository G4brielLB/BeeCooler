 const st=s=>{const v=s.v,n=v.length;return `mín ${Math.min(...v).toFixed(s.dp)} · méd ${(v.reduce((a,b)=>a+b)/n).toFixed(s.dp)} · máx ${Math.max(...v).toFixed(s.dp)} ${s.u}`};
 return `<section class="card" id="cc-${id}"><h3>${ico(ic)}${title}</h3><div class="hv" id="hv-${id}">${note||'Toque ou passe o mouse sobre o gráfico para ver os valores.'}</div>
 <svg class="ch" data-c="${id}" viewBox="0 0 ${Wd} ${Hh}">${g}<line class="cur" y1="${pt}" y2="${Hh-pb}"/></svg>
 <div class="lg">${ss.map(s=>`<button class="lgi ${s.hid?'off':(ss.length>1&&vis.length==1?'on1':'')}" data-c="${id}" data-k="${s.key}"><i style="border-top-style:${s.dash?'dashed':'solid'};border-color:${s.color}"></i><b>${s.name}</b> agora ${s.v[N-1].toFixed(s.dp)} ${s.u}<small>${st(s)}</small></button>`).join('')}</div>${ss.length>1?'<div class="hv" style="margin:6px 0 0">Clique em uma medida para ver só ela; clique de novo para mostrar todas.</div>':''}</section>`}
const m=(ic,l,v,u,c)=>`<div class="m">${ico(ic)}<div><small>${l}</small><b>${v}</b><span>${u}</span>${c||''}</div></div>`;
const chip=(v,lo,hi)=>v>hi?'<em class="tg wa">Acima do ideal</em>':v<lo?'<em class="tg wa">Abaixo do ideal</em>':'<em class="tg ok2">Na faixa ideal</em>';
const sgn=v=>(v>0?'+':'')+v.toFixed(1);
function vib(A){return D.kind=='lora'?chart('c5','Vibração: RMS e pico','wave',A,['rms','pk'],null,0,'Medida pelo acelerômetro em janelas de 10 s (RMS e pico, em mg).')+chart('c6','Energia por faixa de frequência','wave',A,['b0','b1','b2','b3'],null,0,'Nível em dB em quatro faixas de frequência. Clique em uma faixa para ver só ela.')
 :chart('c5','Aceleração: média e pico','wave',A,['am','mx'],null,0,'Em repouso a média fica perto de 1 g (gravidade).')+chart('c6','Intensidade da vibração','wave',A,['sd'],null,0,'Variação da aceleração dentro de cada intervalo: quanto maior, mais vibração.')}
function pSys(){return D.kind=='lora'?pSysL():pSysE()}
function pSysL(){const A=agg(D.rows,D.cols),R=agg(D.rows2,D.cols2),T=D.tot,sum=D.att.reduce((a,b)=>a+b),vb=A.t.length?A.v.vb[A.t.length-1]:null;
 const t=(ic,h,v,s)=>`<div class="card"><h3>${ico(ic)}${h}</h3><div class="m"><div><b>${v}</b></div></div><div class="hv" style="margin-top:4px">${s}</div></div>`;
 return `<h2>Comunicação LoRa sensor → gateway <small>(totais do teste inteiro)</small></h2><div class="sum">
 ${t('chk','Quadros válidos',T.ok,'Recebidos com CRC32 correto')}${t('srv','ACKs transmitidos',T.acks,T.ackf+' falhas de ACK')}${t('cmp','Falhas de CRC',T.crc,T.dis+' byte descartado · '+T.dup+' duplicados')}
 ${t('sig','Entrega na 1ª tentativa',Math.round(D.att[0]/sum*100)+' %',sum+' registros confirmados')}${t('clock','Tempo até o ACK',T.rtt+' ms','Média medida no nó (ida e volta)')}
 ${t('batt','Bateria',vb==null?'—':vb.toFixed(2)+' V','<em class="tg wa">Leitura suspeita</em>')}</div>
 <h2>Energia e tempo</h2><div class="grid">${chart('s1','Tensão da bateria','batt',A,['vb'],null,0,'Leitura em torno de 0,8 V (o primeiro registro marcou 1,66 V): provável bateria desconectada ou ADC sem calibração. O log pede conferir com multímetro.')}
 ${chart('s2','Tempo até o ACK','clock',R,['rtt'],null,0,'Ida e volta medida no nó sensor, só nas execuções com log do nó.')}${chart('s3','Duração do ciclo ativo do nó','clock',R,['cy'],null,0,'Tempo ligado em cada ciclo (medir e enviar).')}
 <section class="card"><h3>${ico('chk')}Tentativas até o ACK</h3><div class="hv">Quantos registros precisaram de 1 a 4 tentativas.</div><div style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;align-items:center">${D.att.map((n,i)=>`<span>${i+1}ª tentativa</span><div><div style="height:10px;background:var(--bd);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${n/sum*100}%;background:var(--ac)"></i></div><small>${n} registros · ${(n/sum*100).toFixed(0)} %</small></div>`).join('')}</div></section></div>
 <h2>Execuções do nó</h2><div class="card tw"><table><tr><th>Execução</th><th>Registros</th><th>Sequências</th><th>Hora</th></tr>${D.se.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>`}
function goLast(){rg='x';day=D.days[D.days.length-1][0];render()}
function pTel(A){const N=A.t.length;
 if(!N)return `<div class="card"><h3>${ico('hex')}Sem dados neste período</h3><p class="hv">Há dados de ${fmt(D.start,FF)} a ${fmt(D.end,FF)}, em ${D.days.length} dias de coleta.</p><button class="btn" onclick="goLast()">Ver o último dia com dados</button></div>`;
 const L=k=>A.v[k][N-1],ti=L('ti'),ri=L('ri'),to=L('to'),ro=L('ro');
 return `<h2>Valores mais recentes do período <small>(${fmt(A.t[N-1],FF)})</small></h2><div class="sum">
 <div class="card top-in"><h3>${ico('hex')}Interno</h3><div class="ms">${m('thermo','Temperatura',ti.toFixed(1),'°C',chip(ti,32,36))}${m('drop','Umidade',ri.toFixed(0),'%',chip(ri,50,75))}</div></div>
 <div class="card top-out"><h3>${ico('sig')}Externo</h3><div class="ms">${m('thermo','Temperatura',to.toFixed(1),'°C')}${m('drop','Umidade',ro.toFixed(0),'%')}</div></div>
 <div class="card top-n"><h3>${ico('cmp')}Diferença (interno − externo)</h3><div class="ms">${m('thermo','Temperatura',sgn(ti-to),'°C')}${m('drop','Umidade',sgn(ri-ro),'p.p.')}</div>
 <div class="hv" style="margin-top:8px">Interno ${Math.abs(ti-to).toFixed(1)} °C ${ti>=to?'mais quente':'mais frio'} e ${Math.abs(ri-ro).toFixed(0)} p.p. ${ri>=ro?'mais úmido':'mais seco'} que o externo.</div></div></div>
 <h2>Interno e externo no mesmo card</h2><div class="grid">${chart('c1','Interno: temperatura e umidade','hex',A,['ti','ri'],[32,36],1,'Faixa verde: intervalo ideal da temperatura interna. Faixa tracejada: ideal da umidade (eixo direito).')}${chart('c2','Externo: temperatura e umidade','sig',A,['to','ro'],null,1,'Tracejada: umidade.')}</div>
 <h2>Comparação interno × externo</h2><div class="grid">${chart('c3','Temperatura: interna × externa','thermo',A,['ti','to'],[32,36],0,'Faixa verde: intervalo ideal da temperatura interna (32 a 36 °C, a validar).')}${chart('c4','Umidade: interna × externa','drop',A,['ri','ro'],[50,75],0,'Faixa verde: intervalo ideal da umidade interna (50 a 75 %, a validar).')}</div>
 <h2>Vibração <small>(acelerômetro ADXL345)</small></h2><div class="grid">${vib(A)}</div>`}
function pSysE(){const{R,C,last}=sysData(),S=i=>last.reduce((a,r)=>a+r[i],0),fail=S(5)+S(6)+S(10)+S(11);
 const t=(ic,h,v,s)=>`<div class="card"><h3>${ico(ic)}${h}</h3><div class="m"><div><b>${v}</b></div></div><div class="hv" style="margin-top:4px">${s}</div></div>`;
 const ses=D.se.map(s=>`<tr class="${s[0]<=W[1]&&s[1]>=W[0]?'in':''}"><td>${fmt(s[0],FF)}</td><td>${Math.round((s[1]-s[0])/60)} min</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td>${s[6]}</td><td>${s[7]}</td></tr>`).join('');
 return `<h2>Comunicação sensor → central <small>(sessões no período: ${last.length})</small></h2><div class="sum">
 ${t('chk','Lotes completos',S(8),'Cada lote tem 60 registros (500 ms)')}${t('srv','Pacotes válidos',S(2),'Recebidos pela central')}${t('sig','ACKs transmitidos',S(7),'Confirmações enviadas ao sensor')}
 ${t('que','Duplicados',S(4),'Fragmentos repetidos')}${t('cmp','Falhas de CRC e malformados',S(5)+S(6),'Pacotes descartados')}${t('wave','Lacunas e perdas de fila',S(10)+S(11),fail?'Houve falhas: veja as sessões':'<b style="color:var(--ok)">Comunicação sem falhas no período</b>')}</div>
 <h2>Desempenho da rede</h2><div class="grid">${chart('s1','Pacotes por minuto','sig',R,['rv','ra'],null,0,'Taxa calculada entre relatórios consecutivos da central.')}${chart('s2','Lotes completos (acumulado na sessão)','chk',C,['dn'],null,0,'Volta a zero a cada nova sessão de coleta.')}</div>
 <h2>Sessões de coleta</h2><div class="card tw"><table><tr><th>Início</th><th>Duração</th><th>Registros</th><th>Lotes</th><th>Pacotes</th><th>Duplicados</th><th>Falhas</th></tr>${ses}</table><div class="hv" style="margin-top:6px">Linhas destacadas: sessões dentro do período escolhido.</div></div>`}
function render(){W=win();const A=agg(D.rows,D.cols),fm=t=>fmt(t,FF);
 $('last').textContent='Último dado: '+fm(D.end);document.querySelectorAll('#src button').forEach(b=>b.classList.toggle('on',b.dataset.s==SRC));$('foot').textContent=D.foot;
 const hd=rg=='c'&&cu.hf!='off'?`, das ${cu.h0} às ${cu.h1}${cu.hf=='ult'?' no último dia registrado':' em cada dia do período'}`:'';
 $('per').textContent='Período: '+fm(W[0])+' até '+fm(W[1]-1)+hd+'. Os períodos rápidos contam a partir do último dado recebido. Lacunas sem dados aparecem como quebras na linha.';
 $('dt').style.display=rg=='x'?'':'none';syncCp();$('dt').value=day;$('dt').min=D.days[0][0];$('dt').max=D.days[D.days.length-1][0];
 $('days').innerHTML=rg=='x'?'Dias com dados: '+D.days.map(d=>`<button data-d="${d[0]}" class="${d[0]==day?'on':''}">${d[0].slice(8)}/${d[0].slice(5,7)}</button>`).join(''):'';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p==page));
 document.querySelectorAll('#rg button').forEach(b=>b.classList.toggle('on',b.dataset.r==rg));
 $('panel').innerHTML=page=='tel'?pTel(A):pSys()}
function syncCp(){const on=rg=='c';$('cp').style.display=on?'':'none';if(!on)return;const dm=cu.g=='mes',L=D.days[D.days.length-1][0],F=D.days[0][0];
 ['cd0','cd1'].forEach(i=>$(i).style.display=dm?'none':'');['cm0','cm1'].forEach(i=>$(i).style.display=dm?'':'none');
 $('cd0').value=cu.d0;$('cd1').value=cu.d1;$('cm0').value=cu.m0;$('cm1').value=cu.m1;$('chf').value=cu.hf;$('ch0').value=cu.h0;$('ch1').value=cu.h1;
 $('chh').style.display=cu.hf=='off'?'none':'';['cd0','cd1'].forEach(i=>{$(i).min=F;$(i).max=L});['cm0','cm1'].forEach(i=>{$(i).min=F.slice(0,7);$(i).max=L.slice(0,7)});
 document.querySelectorAll('#cg button').forEach(b=>b.classList.toggle('on',b.dataset.g==cu.g));
 ['cd0','cd1','cm0','cm1'].forEach(i=>$(i).disabled=cu.hf=='ult')}
$('cp').addEventListener('change',e=>{const i=e.target.id,v=e.target.value;if(i=='chf')cu.hf=v;else if(v){if(i=='cd0')cu.d0=v;if(i=='cd1')cu.d1=v;if(i=='cm0')cu.m0=v;if(i=='cm1')cu.m1=v;if(i=='ch0')cu.h0=v;if(i=='ch1')cu.h1=v}render()});
$('cg').onclick=e=>{const b=e.target.closest('button');if(b){cu.g=b.dataset.g;render()}};
function setSrc(k){SRC=k;D=DS[k];day=D.days[D.days.length-1][0];cu.d0=D.days[0][0];cu.d1=day;cu.m0=cu.d0.slice(0,7);cu.m1=day.slice(0,7);rg='d';for(const o of [HID,CHD,CHA])for(const x in o)delete o[x];render()}
$('src').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.s!=SRC)setSrc(b.dataset.s)};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){page=b.dataset.p;render()}};
$('rg').onclick=e=>{const b=e.target.closest('button');if(b){rg=b.dataset.r;render()}};
$('dt').onchange=e=>{if(e.target.value){day=e.target.value;render()}};
$('days').onclick=e=>{const b=e.target.closest('button');if(b){day=b.dataset.d;render()}};
function hover(e){const sv=e.target.closest&&e.target.closest('svg[data-c]');if(!sv)return;
 const id=sv.dataset.c,{ss,src,pl,pr,Wd,x0,x1}=CHD[id],r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*Wd,tt=x0+(x-pl)/(Wd-pl-pr)*(x1-x0);
 let i=0,bd=1e12;src.t.forEach((t,j)=>{const d=Math.abs(t-tt);if(d<bd){bd=d;i=j}});
 const px=pl+(src.t[i]-x0)/(x1-x0)*(Wd-pl-pr),l=sv.querySelector('.cur');l.setAttribute('x1',px);l.setAttribute('x2',px);l.style.opacity=1;
 $('hv-'+id).innerHTML='<b>'+fmt(src.t[i],FF)+'</b> · '+ss.filter(s=>!s.hid).map(s=>s.name.toLowerCase()+' '+s.v[i].toFixed(s.dp)+' '+s.u).join(' · ')}
document.addEventListener('pointermove',hover);document.addEventListener('pointerdown',hover);
document.addEventListener('pointerout',e=>{const sv=e.target.closest&&e.target.closest('svg[data-c]');if(sv)sv.querySelector('.cur').style.opacity=0});
document.addEventListener('click',e=>{const b=e.target.closest('.lgi');if(!b)return;const id=b.dataset.c,k=b.dataset.k;
 const ks=CHA[id][4];if(ks.length<2)return;const only=ks.every(x=>x==k?!HID[id+x]:HID[id+x]);ks.forEach(x=>HID[id+x]=only?false:x!=k);$('cc-'+id).outerHTML=chart(...CHA[id])});
render();
</script>
</body>
</html>
