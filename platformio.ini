; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = sensor


; ---------------------------------------------------------------- Fase 1
; Firmware de producao. Fontes em src/sensor (no sensor, ESP32-S3) e
; src/gateway (central, ESP32-WROOM). Os envs da Fase 0 ficam mais abaixo.

[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:sensor]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = partitions/sensor_16mb.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<sensor/>

; Modo de teste acelerado (D53): ciclo de 30 s, LoRa a cada 3 min.
[env:sensor_fast]
extends = env:sensor
build_flags =
    ${env:sensor.build_flags}
    -DBEE_TEST_FAST=1

[env:gateway]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions/gateway_4mb.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_src_filter =
    -<*>
    +<gateway/>

; Gateway com injecao de falhas para CT-03 / CT-12.
[env:gateway_fault]
extends = env:gateway
build_flags =
    -DBEE_GATEWAY_FAULT_INJECTION=1

; Testes unitarios no host: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17


; ---------------------------------------------------------------- Fase 0
; Firmwares de teste antigos (nao fazem parte da Fase 1).

[env:phase0_base]
extends = esp32_base
board = esp32dev
lib_deps =
    adafruit/Adafruit ADXL345
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SHT31 Library

[env:sensor_bench]
extends = env:phase0_base
build_src_filter =
    -<*>
    +<sensor_bench/>

[env:sensor_espnow_test]
extends = env:phase0_base
extra_scripts = pre:scripts/load_env.py
build_src_filter =
    -<*>
    +<sensor_espnow_test/>

[env:gateway_espnow_test]
extends = env:phase0_base
extra_scripts = pre:scripts/load_env.py
build_src_filter =
    -<*>
    +<gateway_espnow_test/>
